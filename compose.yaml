services:
  dev:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    # --force replaces a stale dev.json lockfile left behind when the
    # container is killed rather than stopped cleanly
    command: npm run dev -- --force
    stdin_open: true
    tty: true

volumes:
  node_modules:
